<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFA Game | Under Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Manrope:wght@700&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --bg-color: #0F0F11;
            --card-bg: #1A1A1D;
            --text-main: #FFFFFF;
            --text-sec: #A0A0A5;
            --accent: #ff5c00;
            --accent-hover: #dd5000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Центрирование контента заглушки */
        .maintenance-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .maintenance-content {
            text-align: center;
            max-width: 600px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 92, 0, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        h1 {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            line-height: 1;
            margin-bottom: 20px;
            font-weight: 800;
        }

        h1 span {
            -webkit-text-stroke: 1px var(--text-main);
            color: transparent;
        }

        p {
            color: var(--text-sec);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            padding: 16px 32px;
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <div class="maintenance-content">
            <div class="status-badge">Work in Progress</div>
            <h1>SECTION<br><span>UNDER</span> DEVELOPMENT</h1>
            <p>"I'm polishing this section to bring you my top-tier renders. It's going to be hot, stay tuned!"</p>

            <a href="/Portfolio/" class="cta-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 10px;">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                BACK TO HOME
            </a>
        </div>
    </div>

    <script>
        // ГЛОБАЛЬНАЯ ЗАЩИТА (как на остальных страницах)
        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        }, false);

        document.addEventListener('dragstart', function(e) {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        }, false);
    </script>
</body>
</html>
